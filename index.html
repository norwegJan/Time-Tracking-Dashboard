<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./script.js"></script>
    <title>Frontend Mentor | Time tracking dashboard</title>
  </head>
  <body>
    <main>
      <div id="app-container" class="app-container">
        <div id="app-header" class="app-header">
          <div class="header-profile">
            <img src="./images/image-jeremy.png" alt="" class="profile-img" />
            <h1>
              <span class="report">Report for</span><br />
              <span class="name">Jeremy Robson</span>
            </h1>
          </div>
          <div class="header-timeframes">
            <button id="daily" class="daily">Daily</button>
            <button id="weekly" class="weekly">Weekly</button>
            <button id="monthly" class="monthly">Monthly</button>
          </div>
        </div>
        <div id="work" class="work">
          <div class="work-bg"></div>
          <div class="content">
            <div class="work-header">
              <h2 class="activity">Work</h2>
              <img src="./images/icon-ellipsis.svg" alt="" class="ellipsis" />
            </div>
            <div class="work-main">
              <p class="current-hrs">5hrs</p>
              <p class="previous-hrs">Yesterday - 7hrs</p>
            </div>
          </div>
        </div>

        <div id="play" class="play">
          <div class="play-bg"></div>
          <div class="content">
            <div class="play-header">
              <h2 class="activity">Play</h2>
              <img src="./images/icon-ellipsis.svg" alt="" class="ellipsis" />
            </div>
            <div class="play-main">
              <p class="current-hrs">1hrs</p>
              <p class="previous-hrs">Yesterday - 2hrs</p>
            </div>
          </div>
        </div>

        <div id="study" class="study">
          <div class="study-bg"></div>
          <div class="content">
            <div class="study-header">
              <h2 class="activity">Study</h2>
              <img src="./images/icon-ellipsis.svg" alt="" class="ellipsis" />
            </div>
            <div class="study-main">
              <p class="current-hrs">0hrs</p>
              <p class="previous-hrs">Yesterday - 1hrs</p>
            </div>
          </div>
        </div>

        <div id="exercise" class="exercise">
          <div class="exercise-bg"></div>
          <div class="content">
            <div class="exercise-header">
              <h2 class="activity">Exercise</h2>
              <img src="./images/icon-ellipsis.svg" alt="" class="ellipsis" />
            </div>
            <div class="exercise-main">
              <p class="current-hrs">1hrs</p>
              <p class="previous-hrs">Yesterday - 1hrs</p>
            </div>
          </div>
        </div>

        <div id="social" class="social">
          <div class="social-bg"></div>
          <div class="content">
            <div class="social-header">
              <h2 class="activity">Social</h2>
              <img src="./images/icon-ellipsis.svg" alt="" class="ellipsis" />
            </div>
            <div class="social-main">
              <p class="current-hrs">1hrs</p>
              <p class="previous-hrs">Yesterday - 3hrs</p>
            </div>
          </div>
        </div>

        <div id="self-care" class="self-care">
          <div class="self-care-bg"></div>
          <div class="content">
            <div class="self-care-header">
              <h2 class="activity">Self Care</h2>
              <img src="./images/icon-ellipsis.svg" alt="" class="ellipsis" />
            </div>
            <div class="self-care-main">
              <p class="current-hrs">0hrs</p>
              <p class="previous-hrs">Yesterday - 1hrs</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <div class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
          >Frontend Mentor</a
        >. Coded by <a href="https://github.com/norwegJan">norwegJan</a>.
      </div>
    </footer>
  </body>
</html>
