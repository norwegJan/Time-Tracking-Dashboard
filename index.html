<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./script.js"></script>
    <title>Frontend Mentor | Time tracking dashboard</title>
  </head>
  <body>
    <main>
      <div id="app-container" class="app-container">
        <div id="app-header" class="app-header">
          <div class="header-profile">
            <img
              src="./images/image-jeremy.png"
              alt=""
              width="70px"
              class="profile-img"
            />
            <div class="report-for">
              <p class="report">Report for</p>
              <p class="name">Jeremy Robson</p>
            </div>
          </div>
          <div class="header-timeframes">
            <p role="button" id="daily" class="daily">Daily</p>
            <p role="button" id="weekly" class="weekly">Weekly</p>
            <p role="button" id="monthly" class="monthly">Monthly</p>
          </div>
        </div>

        <div id="work" class="work">
          <div class="work-bg"></div>
          <div class="content">
            <div class="work-header">
              <p class="activity">Work</p>
              <img src="./images/icon-ellipsis.svg" alt="" />
            </div>
            <div class="work-main">
              <p class="current-hrs">32hrs</p>
              <p class="previous-hrs">Previous - 36hrs</p>
            </div>
          </div>
        </div>

        <div id="play" class="play">
          <div class="play-bg"></div>
          <div class="content">
            <div class="play-header">
              <p class="activity">Play</p>
              <img src="./images/icon-ellipsis.svg" alt="" />
            </div>
            <div class="play-main">
              <p class="current-hrs">10hrs</p>
              <p class="previous-hrs">Previous - 8hrs</p>
            </div>
          </div>
        </div>

        <div id="study" class="study">
          <div class="study-bg"></div>
          <div class="content">
            <div class="study-header">
              <p class="activity">Study</p>
              <img src="./images/icon-ellipsis.svg" alt="" />
            </div>
            <div class="study-main">
              <p class="current-hrs">4hrs</p>
              <p class="previous-hrs">Previous - 7hrs</p>
            </div>
          </div>
        </div>

        <div id="exercise" class="exercise">
          <div class="exercise-bg"></div>
          <div class="content">
            <div class="exercise-header">
              <p class="activity">Exercise</p>
              <img src="./images/icon-ellipsis.svg" alt="" />
            </div>
            <div class="exercise-main">
              <p class="current-hrs">4hrs</p>
              <p class="previous-hrs">Previous - 7hrs</p>
            </div>
          </div>
        </div>

        <div id="social" class="social">
          <div class="social-bg"></div>
          <div class="content">
            <div class="social-header">
              <p class="activity">Social</p>
              <img src="./images/icon-ellipsis.svg" alt="" />
            </div>
            <div class="social-main">
              <p class="current-hrs">5hrs</p>
              <p class="previous-hrs">Previous - 10hrs</p>
            </div>
          </div>
        </div>

        <div id="self-care" class="self-care">
          <div class="self-care-bg"></div>
          <div class="content">
            <div class="self-care-header">
              <p class="activity">Self Care</p>
              <img src="./images/icon-ellipsis.svg" alt="" />
            </div>
            <div class="self-care-main">
              <p class="current-hrs">2hrs</p>
              <p class="previous-hrs">Previous - 2hrs</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <!-- <div class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
          >Frontend Mentor</a
        >. Coded by <a href="#">Your Name Here</a>.
      </div> -->
    </footer>
  </body>
</html>
